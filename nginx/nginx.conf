# Reverse proxy for the three public domains, replacing Caddy.
#
# Caddy (Go's crypto/tls) was found to throw a fatal internal_error alert on
# a specific real-world ClientHello shape sent by modern Chrome/Edge —
# reproduced via raw packet capture and byte-exact replay against the live
# server, confirmed across two Caddy versions and even a bare-minimum Caddy
# config with no custom Caddyfile. nginx terminates TLS via OpenSSL instead
# of Go's TLS stack, which isn't exposed to that bug class.
#
# TLS certs are issued/renewed by the sibling `certbot` service via the
# ACME HTTP-01 challenge (see nginx/init-letsencrypt.sh for first-time setup).

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # nginx resolves proxy_pass hostnames once at config load by default,
    # which fails startup outright if an upstream container isn't in Docker's
    # DNS yet. Using a variable + explicit resolver (Docker's embedded DNS)
    # defers resolution to request time and re-resolves periodically instead.
    resolver 127.0.0.11 valid=10s;

    # Plain HTTP: serve ACME challenges, redirect everything else to HTTPS.
    server {
        listen 80;
        server_name atlasbank.dev api.atlasbank.dev auth.atlasbank.dev;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name atlasbank.dev;

        ssl_certificate     /etc/letsencrypt/live/atlasbank.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/atlasbank.dev/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Security headers. Content-Security-Policy is deliberately NOT set here yet —
        # getting it right needs auditing the actual built bundle's script/style/frame
        # sources first (a wrong CSP fails silently as a blank page in production,
        # worse than the gap it'd close), so it's tracked as a separate, tested
        # follow-up rather than guessed at here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Safe here (and on api.atlasbank.dev) since neither is ever legitimately
        # iframed. Deliberately NOT applied to auth.atlasbank.dev below — Keycloak is
        # this app's OIDC authority, and react-oidc-context's automaticSilentRenew can
        # fall back to a hidden same-origin-to-authority iframe for token refresh;
        # blocking framing there risks silently breaking silent renew without a live
        # test to confirm oidc-client-ts's actual renewal path first.
        add_header X-Frame-Options "DENY" always;

        # Host-level system health endpoint (memory/swap, disk, load, container
        # health) for the cloud monitoring routine — see infra/health-check/.
        # Runs as a systemd service on the VM itself, not in a container, so
        # `host.docker.internal` (enabled via nginx's `extra_hosts` in
        # docker-compose.prod.yml) is needed to reach it from here.
        location /_health/system {
            proxy_pass http://host.docker.internal:8099/;
            proxy_set_header Host $host;
        }

        location / {
            set $upstream frontend:80;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.atlasbank.dev;

        ssl_certificate     /etc/letsencrypt/live/atlasbank.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/atlasbank.dev/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            set $upstream api-gateway:8080;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name auth.atlasbank.dev;

        ssl_certificate     /etc/letsencrypt/live/atlasbank.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/atlasbank.dev/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # No X-Frame-Options here — see the comment on the atlasbank.dev server block.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            set $upstream keycloak:8080;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keycloak's KC_PROXY=edge trusts these to reconstruct the public
            # https://auth.atlasbank.dev URL instead of the internal one.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

    # Other projects sharing this VM's nginx drop their own server blocks here via a
    # bind-mounted conf.d directory (see the `nginx` service's volumes in
    # docker-compose.prod.yml) instead of being hand-pasted into this file — keeps this
    # file self-contained to atlas-bank regardless of what else runs on the box.
    include /etc/nginx/conf.d/*.conf;
}
