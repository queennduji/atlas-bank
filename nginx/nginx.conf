# Reverse proxy for the three public domains, replacing Caddy.
#
# Caddy (Go's crypto/tls) was found to throw a fatal internal_error alert on
# a specific real-world ClientHello shape sent by modern Chrome/Edge —
# reproduced via raw packet capture and byte-exact replay against the live
# server, confirmed across two Caddy versions and even a bare-minimum Caddy
# config with no custom Caddyfile. nginx terminates TLS via OpenSSL instead
# of Go's TLS stack, which isn't exposed to that bug class.
#
# TLS certs are issued/renewed by the sibling `certbot` service via the
# ACME HTTP-01 challenge (see nginx/init-letsencrypt.sh for first-time setup).

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # nginx resolves proxy_pass hostnames once at config load by default,
    # which fails startup outright if an upstream container isn't in Docker's
    # DNS yet. Using a variable + explicit resolver (Docker's embedded DNS)
    # defers resolution to request time and re-resolves periodically instead.
    resolver 127.0.0.11 valid=10s;

    # Plain HTTP: serve ACME challenges, redirect everything else to HTTPS.
    server {
        listen 80;
        server_name atlasbank.dev api.atlasbank.dev auth.atlasbank.dev;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name atlasbank.dev;

        ssl_certificate     /etc/letsencrypt/live/atlasbank.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/atlasbank.dev/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Security headers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        # Content-Security-Policy — audited against the actual production build
        # (frontend/dist/index.html): one hashed same-origin <script type="module">,
        # one hashed same-origin stylesheet, zero inline scripts/styles, zero CDN
        # resources. oidc-client-ts's source confirms signinSilent() only falls back
        # to its hidden iframe when no refresh_token exists — this app always has
        # one and never sets silent_redirect_uri, so that path is never reached;
        # frame-src can be 'none' and auth.atlasbank.dev's own framing is likewise
        # safe to deny (see its server block below). connect-src needs
        # auth.atlasbank.dev for the refresh-token POST oidc-client-ts makes
        # directly (not a top-level navigation, so it needs the explicit allowance)
        # and api.atlasbank.dev for every REST call the app makes.
        #
        # ROLLOUT: ran Report-Only first and walked the full app (register, login,
        # dashboard, open account, deposit, cards, statements, profile) — clean
        # except one harmless 'unsafe-eval' report traced to the browser automation
        # harness's own script-evaluation mechanism (fires even with zero page
        # interaction; nothing in the shipped bundle contains eval()/new Function() —
        # confirmed by grepping frontend/dist/assets/*.js). Switched to enforcing
        # after that clean pass; re-verified the same full walkthrough afterward with
        # enforcement genuinely on, not just report-only.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://api.atlasbank.dev https://auth.atlasbank.dev; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

        # Host-level system health endpoint (memory/swap, disk, load, container
        # health) for the cloud monitoring routine — see infra/health-check/.
        # Runs as a systemd service on the VM itself, not in a container, so
        # `host.docker.internal` (enabled via nginx's `extra_hosts` in
        # docker-compose.prod.yml) is needed to reach it from here.
        location /_health/system {
            proxy_pass http://host.docker.internal:8099/;
            proxy_set_header Host $host;
        }

        location / {
            set $upstream frontend:80;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.atlasbank.dev;

        ssl_certificate     /etc/letsencrypt/live/atlasbank.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/atlasbank.dev/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        # Pure JSON API — no active content ever needs to run here, even if someone
        # navigates a browser directly to an endpoint URL and it renders as a document.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        location / {
            set $upstream api-gateway:8080;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name auth.atlasbank.dev;

        ssl_certificate     /etc/letsencrypt/live/atlasbank.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/atlasbank.dev/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # X-Frame-Options was deliberately withheld here until confirming
        # oidc-client-ts never uses a hidden iframe against this origin for silent
        # token renewal — its source (signinSilent in oidc-client-ts) shows the
        # iframe path only triggers when no refresh_token exists, and this app
        # always has one and never sets silent_redirect_uri, so it's never reached.
        # Safe to deny framing here too.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            set $upstream keycloak:8080;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keycloak's KC_PROXY=edge trusts these to reconstruct the public
            # https://auth.atlasbank.dev URL instead of the internal one.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

    # Other projects sharing this VM's nginx drop their own server blocks here via a
    # bind-mounted conf.d directory (see the `nginx` service's volumes in
    # docker-compose.prod.yml) instead of being hand-pasted into this file — keeps this
    # file self-contained to atlas-bank regardless of what else runs on the box.
    include /etc/nginx/conf.d/*.conf;
}
