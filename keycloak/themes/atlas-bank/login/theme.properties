# Extends Keycloak's built-in theme unchanged – we only override login.ftl below to
# always show a "Register" link pointing at the AtlasBank app's own /register page
# (Keycloak's native self-registration is intentionally left disabled on the realm,
# since it would create a Keycloak user without the matching Customer record our
# CustomerService needs – this link routes people through our real registration flow
# instead).
parent=keycloak.v2
import=common/keycloak

# Public, read-only demo account. The login page shows these on purpose (see login.ftl),
# so they are not secrets. What keeps the account harmless is that the gateway rejects
# every non-GET request for tokens carrying the demo-viewer role. Keep in sync with
# infra/demo/seed_demo.py, which creates the user.
demoUsername=demo@atlasbank.dev
demoPassword=Demo-Viewer-2026
