# Extends Keycloak's built-in theme unchanged — we only override login.ftl below to
# always show a "Register" link pointing at the AtlasBank app's own /register page
# (Keycloak's native self-registration is intentionally left disabled on the realm,
# since it would create a Keycloak user without the matching Customer record our
# CustomerService needs — this link routes people through our real registration flow
# instead).
parent=keycloak.v2
import=common/keycloak

# Update this when deploying to a real domain (e.g. https://atlasbank.example.com).
frontendUrl=http://localhost:3000
