services:

  seq:
    # Pinned — Seq's `latest` tag has broken past deployments by shipping a
    # stricter first-run auth requirement with no warning. 2026.1 is the
    # version this whole stack was actually built and tested against.
    image: datalust/seq:2026.1
    environment:
      ACCEPT_EULA: Y
      # Newer Seq versions require an explicit auth decision on first run —
      # without it the container crash-loops. No auth needed for local dev.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data
    networks:
      - atlas-net

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - atlas-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Without a fixed hostname, Keycloak reports whatever host:port the caller used to
      # reach it as the token issuer — fine for the browser (localhost:8080) but wrong
      # when backend services fetch OIDC metadata via the container hostname
      # (keycloak:8080), which would make issuer validation fail. Pin it so every token
      # and discovery document consistently claims http://localhost:8080, matching what
      # the browser/frontend actually uses.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./keycloak/themes/atlas-bank:/opt/keycloak/themes/atlas-bank
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - atlas-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "REDACTED-ROTATED"
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atlas-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: atlas
      RABBITMQ_DEFAULT_PASS: atlas
    networks:
      - atlas-net

  customer-service:
    build:
      context: .
      dockerfile: src/Services/CustomerService/AtlasBank.CustomerService/Dockerfile
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=AtlasBank_Customers;Username=postgres;Password=REDACTED-ROTATED
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/atlas-bank/.well-known/openid-configuration
      - Keycloak__BaseUrl=http://keycloak:8080
      - Keycloak__AdminUsername=admin
      - Keycloak__AdminPassword=admin
      # appsettings.json binds Kestrel to specific localhost ports for local `dotnet run`
      # dev — override both endpoints to bind on all interfaces so the container's
      # published port (REST) and other services' gRPC calls (8081) actually work.
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - Kestrel__Endpoints__Grpc__Url=http://+:8081
      - Seq__ServerUrl=http://seq:5341
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      seq:
        condition: service_started
    networks:
      - atlas-net

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/AtlasBank.ApiGateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # appsettings.Development.json targets running services locally outside Docker
      # (localhost + distinct ports per service) — override it back to the container
      # hostnames appsettings.json already has for the Docker network.
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/atlas-bank/.well-known/openid-configuration
      - ReverseProxy__Clusters__customers-cluster__Destinations__primary__Address=http://customer-service:8080
      - ReverseProxy__Clusters__accounts-cluster__Destinations__primary__Address=http://account-service:8080
      - ReverseProxy__Clusters__transactions-cluster__Destinations__primary__Address=http://transaction-service:8080
      - ReverseProxy__Clusters__ledger-cluster__Destinations__primary__Address=http://ledger-service:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      keycloak:
        condition: service_started
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      card-service:
        condition: service_healthy
      statement-service:
        condition: service_healthy
    networks:
      - atlas-net

  frontend:
    build:
      context: ./frontend
      # These become build-time constants baked into the JS bundle (Vite inlines
      # import.meta.env at build, not runtime) — they must be URLs the *browser* can
      # reach, i.e. the host-published ports below, not container hostnames.
      args:
        VITE_GATEWAY_URL: http://localhost:5000
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: atlas-bank
        VITE_KEYCLOAK_CLIENT_ID: atlas-bank-app
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - atlas-net

  account-service:
    build:
      context: .
      dockerfile: src/Services/AccountService/AtlasBank.AccountService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=AtlasBank_Accounts;Username=postgres;Password=REDACTED-ROTATED
      - CustomerService__GrpcUrl=http://customer-service:8081
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/atlas-bank/.well-known/openid-configuration
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - Kestrel__Endpoints__Grpc__Url=http://+:8081
      - Seq__ServerUrl=http://seq:5341
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      seq:
        condition: service_started
      customer-service:
        condition: service_healthy
    networks:
      - atlas-net

  transaction-service:
    build:
      context: .
      dockerfile: src/Services/TransactionService/AtlasBank.TransactionService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=AtlasBank_Transactions;Username=postgres;Password=REDACTED-ROTATED
      - AccountService__GrpcUrl=http://account-service:8081
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/atlas-bank/.well-known/openid-configuration
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - Kestrel__Endpoints__Grpc__Url=http://+:8081
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=atlas
      - RabbitMQ__Password=atlas
      - Seq__ServerUrl=http://seq:5341
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
      seq:
        condition: service_started
      account-service:
        condition: service_healthy
    networks:
      - atlas-net

  ledger-service:
    build:
      context: .
      dockerfile: src/Services/LedgerService/AtlasBank.LedgerService/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=AtlasBank_Ledger;Username=postgres;Password=REDACTED-ROTATED
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/atlas-bank/.well-known/openid-configuration
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=atlas
      - RabbitMQ__Password=atlas
      - Seq__ServerUrl=http://seq:5341
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
      seq:
        condition: service_started
    networks:
      - atlas-net

  notification-service:
    build:
      context: .
      dockerfile: src/Services/NotificationService/AtlasBank.NotificationService/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=AtlasBank_Notifications;Username=postgres;Password=REDACTED-ROTATED
      - AccountService__GrpcUrl=http://account-service:8081
      - CustomerService__GrpcUrl=http://customer-service:8081
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/atlas-bank/.well-known/openid-configuration
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=atlas
      - RabbitMQ__Password=atlas
      - Seq__ServerUrl=http://seq:5341
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
      seq:
        condition: service_started
      account-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    networks:
      - atlas-net

  card-service:
    build:
      context: .
      dockerfile: src/Services/CardService/AtlasBank.CardService/Dockerfile
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=AtlasBank_Cards;Username=postgres;Password=REDACTED-ROTATED
      - AccountService__GrpcUrl=http://account-service:8081
      - CustomerService__GrpcUrl=http://customer-service:8081
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/atlas-bank/.well-known/openid-configuration
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__Username=atlas
      - RabbitMQ__Password=atlas
      - Seq__ServerUrl=http://seq:5341
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
      seq:
        condition: service_started
      account-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    networks:
      - atlas-net

  statement-service:
    build:
      context: .
      dockerfile: src/Services/StatementService/AtlasBank.StatementService/Dockerfile
    ports:
      - "5007:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=AtlasBank_Statements;Username=postgres;Password=REDACTED-ROTATED
      - AccountService__GrpcUrl=http://account-service:8081
      - CustomerService__GrpcUrl=http://customer-service:8081
      - TransactionService__GrpcUrl=http://transaction-service:8081
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/atlas-bank/.well-known/openid-configuration
      - Seq__ServerUrl=http://seq:5341
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      seq:
        condition: service_started
      account-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    networks:
      - atlas-net

volumes:
  keycloak-db-data:
  postgres-data:
  seq-data:

networks:
  atlas-net:
    driver: bridge
