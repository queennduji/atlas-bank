<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64a6bd" />
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7d" />
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#1c2735" />

  <text x="40" y="52" fill="#fbf7fb" font-size="34" font-weight="700">AtlasBank</text>
  <text x="40" y="80" fill="#8fa3b3" font-size="17">Event-driven banking microservices &#8212; .NET, Docker, RabbitMQ, Keycloak</text>

  <!-- Client -->
  <rect x="40" y="120" width="150" height="56" rx="8" fill="#2e4057" stroke="#64a6bd" stroke-width="1.5" />
  <text x="115" y="154" fill="#fbf7fb" font-size="17" font-weight="600" text-anchor="middle">Client</text>

  <!-- API Gateway -->
  <rect x="260" y="120" width="190" height="56" rx="8" fill="#32535e" stroke="#83b692" stroke-width="2" />
  <text x="355" y="154" fill="#fbf7fb" font-size="17" font-weight="700" text-anchor="middle">API Gateway</text>

  <!-- Keycloak -->
  <rect x="520" y="120" width="190" height="56" rx="8" fill="#2e4057" stroke="#fcb07e" stroke-width="1.5" />
  <text x="615" y="147" fill="#fbf7fb" font-size="16" font-weight="600" text-anchor="middle">Keycloak</text>
  <text x="615" y="165" fill="#c9b8a8" font-size="12" text-anchor="middle">OAuth2 / OIDC</text>

  <!-- Client -> Gateway -->
  <line x1="190" y1="148" x2="256" y2="148" stroke="#64a6bd" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Gateway <-> Keycloak -->
  <line x1="516" y1="148" x2="454" y2="148" stroke="#fcb07e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />

  <!-- Services row -->
  <!-- Customer, Account, Transaction, Ledger, Notification -->
  <g font-size="16" font-weight="600">
    <rect x="40"  y="260" width="205" height="60" rx="8" fill="#243447" stroke="#83b692" stroke-width="1.5" />
    <text x="142" y="296" fill="#fbf7fb" text-anchor="middle">Customer Service</text>

    <rect x="285" y="260" width="205" height="60" rx="8" fill="#243447" stroke="#83b692" stroke-width="1.5" />
    <text x="387" y="296" fill="#fbf7fb" text-anchor="middle">Account Service</text>

    <rect x="530" y="260" width="205" height="60" rx="8" fill="#243447" stroke="#83b692" stroke-width="1.5" />
    <text x="632" y="296" fill="#fbf7fb" text-anchor="middle">Transaction Service</text>

    <rect x="775" y="260" width="205" height="60" rx="8" fill="#243447" stroke="#83b692" stroke-width="1.5" />
    <text x="877" y="296" fill="#fbf7fb" text-anchor="middle">Ledger Service</text>

    <rect x="1020" y="260" width="145" height="60" rx="8" fill="#243447" stroke="#83b692" stroke-width="1.5" />
    <text x="1092" y="289" fill="#fbf7fb" text-anchor="middle">Notification</text>
    <text x="1092" y="307" fill="#fbf7fb" text-anchor="middle">Service</text>
  </g>

  <!-- Gateway -> services -->
  <line x1="387" y1="176" x2="387" y2="256" stroke="#5b6b7d" stroke-width="1.5" marker-end="url(#arrowDim)" />
  <line x1="500" y1="176" x2="620" y2="256" stroke="#5b6b7d" stroke-width="1.5" marker-end="url(#arrowDim)" />
  <line x1="600" y1="176" x2="855" y2="256" stroke="#5b6b7d" stroke-width="1.5" marker-end="url(#arrowDim)" />
  <line x1="620" y1="176" x2="1080" y2="256" stroke="#5b6b7d" stroke-width="1.5" marker-end="url(#arrowDim)" />

  <!-- Account <-> Customer -->
  <line x1="285" y1="290" x2="249" y2="290" stroke="#83b692" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- RabbitMQ -->
  <rect x="530" y="380" width="205" height="56" rx="8" fill="#3a2e1c" stroke="#fcb07e" stroke-width="2" />
  <text x="632" y="410" fill="#fbf7fb" font-size="16" font-weight="700" text-anchor="middle">RabbitMQ</text>
  <text x="632" y="427" fill="#e0c9a6" font-size="11" text-anchor="middle">async events</text>

  <line x1="632" y1="320" x2="632" y2="376" stroke="#fcb07e" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="700" y1="380" x2="850" y2="322" stroke="#fcb07e" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="735" y1="400" x2="1080" y2="322" stroke="#fcb07e" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- SQL Server -->
  <rect x="40" y="480" width="940" height="56" rx="8" fill="#243447" stroke="#64a6bd" stroke-width="1.5" />
  <text x="510" y="510" fill="#fbf7fb" font-size="16" font-weight="700" text-anchor="middle">SQL Server</text>
  <text x="510" y="527" fill="#9fb4c2" font-size="11" text-anchor="middle">database-per-service</text>

  <line x1="142" y1="320" x2="142" y2="476" stroke="#5b6b7d" stroke-width="1.5" marker-end="url(#arrowDim)" />
  <line x1="387" y1="320" x2="387" y2="476" stroke="#5b6b7d" stroke-width="1.5" marker-end="url(#arrowDim)" />
  <line x1="632" y1="320" x2="632" y2="476" stroke="#5b6b7d" stroke-width="1.5" marker-end="url(#arrowDim)" style="display:none" />
  <line x1="700" y1="436" x2="620" y2="476" stroke="#5b6b7d" stroke-width="1.5" marker-end="url(#arrowDim)" />
  <line x1="877" y1="320" x2="877" y2="476" stroke="#5b6b7d" stroke-width="1.5" marker-end="url(#arrowDim)" />

  <!-- Footer badges -->
  <g font-size="13" font-weight="600">
    <rect x="40" y="560" width="270" height="36" rx="18" fill="#243447" stroke="#83b692" stroke-width="1" />
    <text x="175" y="583" fill="#c8e6d3" text-anchor="middle">Serilog &#8594; Seq structured logging</text>

    <rect x="330" y="560" width="230" height="36" rx="18" fill="#243447" stroke="#64a6bd" stroke-width="1" />
    <text x="445" y="583" fill="#bfe0ee" text-anchor="middle">Dockerized &#8226; docker-compose</text>

    <rect x="580" y="560" width="220" height="36" rx="18" fill="#243447" stroke="#fcb07e" stroke-width="1" />
    <text x="690" y="583" fill="#f6dcbe" text-anchor="middle">Per-IP rate limiting &#8226; CORS</text>
  </g>

  <text x="1160" y="590" fill="#5b6b7d" font-size="13" text-anchor="end">github.com/queennduji/atlas-bank</text>
</svg>
